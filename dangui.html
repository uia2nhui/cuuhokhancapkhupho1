<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cứu Hộ Khẩn Cấp - Người Dân</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full bg-white border p-6 rounded-2xl shadow-lg my-6">
        <h2 class="text-xl font-black text-red-600 text-center mb-1">🚨 BÁO CỨU HỘ KHẨN CẤP</h2>
        <p class="text-xs text-gray-500 text-center mb-5">Hệ thống tiếp nhận thông tin cứu trợ thiên tai Khu Phố 1</p>
        
        <form id="publicForm" onsubmit="submitPublicForm(event)" class="space-y-3">
            <input type="hidden" id="formType" value="rescue">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Họ và tên chủ hộ *</label>
                <input type="text" id="fullname" required class="w-full border rounded-xl p-2.5 text-sm" placeholder="Nguyễn Văn A">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Số điện thoại liên hệ *</label>
                <input type="tel" id="phone" required class="w-full border rounded-xl p-2.5 text-sm" placeholder="0901234567">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Số nhà / Địa chỉ hiện tại *</label>
                <input type="text" id="address" required class="w-full border rounded-xl p-2.5 text-sm" placeholder="Số 123, Đường ABC...">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Tọa độ GPS vị trí khẩn cấp</label>
                <div class="flex gap-2">
                    <input type="text" id="gps" readonly class="w-full border rounded-xl p-2.5 text-sm bg-gray-50" placeholder="Bấm nút bên để lấy GPS">
                    <button type="button" onclick="getLocation()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap">📍 Lấy GPS</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Tổng số người</label>
                    <input type="number" id="totalPeople" min="1" value="1" class="w-full border rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Số người già</label>
                    <input type="number" id="elders" min="0" value="0" class="w-full border rounded-xl p-2.5 text-sm">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Số trẻ em</label>
                    <input type="number" id="children" min="0" value="0" class="w-full border rounded-xl p-2.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">Phụ nữ mang thai</label>
                    <input type="number" id="pregnant" min="0" value="0" class="w-full border rounded-xl p-2.5 text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Số người lớn</label>
                <input type="number" id="adults" min="1" value="1" class="w-full border rounded-xl p-2.5 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Loại nhà ở</label>
                <select id="houseType" class="w-full border rounded-xl p-2.5 text-sm bg-white">
                    <option value="Nhà Cấp 4">Nhà Cấp 4</option>
                    <option value="Nhà Tạm / Nhà Tranh">Nhà Tạm / Nhà Tranh</option>
                    <option value="Nhà Kiên Cố 1 Tầng">Nhà Kiên Cố 1 Tầng</option>
                    <option value="Nhà Kiên Cố Nhiều Tầng">Nhà Kiên Cố Nhiều Tầng</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Mức độ ưu tiên</label>
                <select id="priority" class="w-full border rounded-xl p-2.5 text-sm bg-white font-bold text-red-600">
                    <option value="Cấp 1">Cấp 1 - Đỏ (Nguy cấp nhất)</option>
                    <option value="Cấp 2" selected>Cấp 2 - Cam (Cao)</option>
                    <option value="Cấp 3">Cấp 3 - Vàng (Trung bình)</option>
                    <option value="Cấp 4">Cấp 4 - Xanh (Bình thường)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Nhu cầu / Tình trạng khẩn cấp *</label>
                <select id="priorityOrNeed" class="w-full border rounded-xl p-2.5 text-sm bg-white font-bold text-red-600">
                    <option value="Cần sơ tán gấp đến nơi an toàn">🚨 Cần sơ tán gấp đến nơi an toàn</option>
                    <option value="Bị cô lập, cần nước uống lương thực">⚠️ Bị cô lập, cần nước uống & lương thực</option>
                    <option value="Có người bệnh nặng cần hỗ trợ y tế">💊 Có người bệnh nặng cần hỗ trợ y tế</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Ghi chú thêm</label>
                <textarea id="note" rows="2" class="w-full border rounded-xl p-2.5 text-sm" placeholder="Mô tả nước ngập, người ốm..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-red-600 text-white py-3 rounded-xl font-black text-sm hover:bg-red-700 shadow-lg">
                🌐 GỬI YÊU CẦU CỨU HỘ (CÓ MẠNG)
            </button>
            <button type="button" onclick="sendSMS()" class="w-full bg-zinc-800 text-white py-3 rounded-xl font-black text-sm hover:bg-zinc-900 shadow-lg flex items-center justify-center gap-2">
                💬 GỬI TIN NHẮN SMS (MẤT MẠNG)
            </button>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPDyWV8utFhJlvSF0bgepiGU0yWuFqcpi47UJ4hgBYgXt4dY5LKp9qG38QVKNd8S2L/exec"; // Thay link Web App của bạn
        const HOTLINE_SMS = "0777780582"; // Số tổng đài trực ban

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('gps').value = "Đang định vị...";
                navigator.geolocation.getCurrentPosition(pos => {
                    document.getElementById('gps').value = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
                }, () => { alert("Không lấy được GPS!"); document.getElementById('gps').value = ""; }, { enableHighAccuracy: true });
            } else { alert("Trình duyệt không hỗ trợ GPS."); }
        }

        function submitPublicForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "Đang gửi...";

            const payload = {
                formType: 'rescue',
                fullname: document.getElementById('fullname').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                gps: document.getElementById('gps').value,
                totalPeople: document.getElementById('totalPeople').value,
                elders: document.getElementById('elders').value,
                children: document.getElementById('children').value,
                pregnant: document.getElementById('pregnant').value,
                adults: document.getElementById('adults').value,
                houseType: document.getElementById('houseType').value,
                priority: document.getElementById('priority').value,
                priorityOrNeed: document.getElementById('priorityOrNeed').value,
                note: document.getElementById('note').value,
                doi: 'Đội 1'
            };

            fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
            .then(() => {
                alert("✅ Gửi yêu cầu thành công!");
                document.getElementById('publicForm').reset();
                btn.disabled = false; btn.innerText = "🌐 GỬI YÊU CẦU CỨU HỘ (CÓ MẠNG)";
            }).catch(err => { alert("Lỗi: " + err); btn.disabled = false; btn.innerText = "🌐 GỬI YÊU CẦU CỨU HỘ (CÓ MẠNG)"; });
        }

        function sendSMS() {
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const gps = document.getElementById('gps').value || 'Chưa có GPS';
            const totalPeople = document.getElementById('totalPeople').value;
            const elders = document.getElementById('elders').value;
            const children = document.getElementById('children').value;
            const pregnant = document.getElementById('pregnant').value;
            const adults = document.getElementById('adults').value;
            const houseType = document.getElementById('houseType').value;
            const priority = document.getElementById('priority').value;
            const need = document.getElementById('priorityOrNeed').value;
            const note = document.getElementById('note').value;

            if(!name || !phone || !address) { 
                alert("Vui lòng điền Tên, SĐT, Địa chỉ!"); 
                return; 
            }

            // Gom nhóm và viết tắt gọn gàng để không bị tràn dung lượng SMS
            const smsContent = `CUUHO [${priority}] ` + `Ten: ${name}, SDT: ${phone}, DC:${address}, GPS: ${gps}. ` + `SL: ${totalPeople}nguoi (Gia:${elders}, TreEm:${children}, Bau:${pregnant}, Lon:${adults}). ` +
                `Nha: ${houseType}. YeuCau: ${need}. ` +
                `Note: ${note}`;  window.location.href = `sms:${HOTLINE_SMS}?
